name: Build Android app

on:
  push:
    branches: [main]
    paths: ["src/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle the clock and its fonts for offline use
        run: node android/export-site.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Clock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Clock-apk
          path: Clock.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Clock for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Clock.apk
          body: |
            clock.mazzen.dev as an Android app that works with no internet.
            Download `Clock.apk` on your phone and tap it to install
            (allow installs from your browser or files app when asked).
            Always-latest link: https://github.com/Mazika-1/clock/releases/latest/download/Clock.apk
